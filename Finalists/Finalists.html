<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camo Selector</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 id="pageTitle"></h1>
    <div class="topbar-actions">
      <label class="language-control">
        <span id="languageLabel"></span>
        <select id="languageSelect" aria-label="Language"></select>
      </label>
      <a id="discordButton" class="discord-button" href="#" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </header>

  <main>
    <section id="tileGrid" class="tile-grid" aria-live="polite"></section>
  </main>

  <section id="selectionBar" class="selection-bar" aria-live="polite">
    <div class="selection-content">
      <span id="selectionLabel"></span>
      <code id="selectionOutput"></code>
    </div>
    <button id="copyButton" type="button"></button>
  </section>

  <div id="renderModal" class="modal" hidden>
    <button id="modalBackdrop" class="modal-backdrop" type="button" aria-label="Close"></button>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <button id="closeModalButton" class="icon-button" type="button" aria-label="Close">×</button>
      </div>

      <div class="render-stage">
        <img id="renderImage" alt="" />
      </div>

      <div class="render-controls">
        <button id="previousRenderButton" type="button"></button>
        <span id="renderCounter"></span>
        <button id="nextRenderButton" type="button"></button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
