<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>WoT Blitz Camouflage Contest 2026 Finalists</title>
  <meta name="description" content="View the finalists and vote for your favorite camouflage designs." />
  <meta name="theme-color" content="#111111" />

  <!-- Static link preview metadata for Discord, social sites, and messaging apps. -->
  <meta property="og:title" content="WoT Blitz Camouflage Contest 2026 Finalists" />
  <meta property="og:description" content="View the finalists and vote for your favorite camouflage designs." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://aeson000.github.io/camo-contest/Finalists/embed.png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:image:alt" content="WoT Blitz Camouflage Contest 2026 Finalists" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="WoT Blitz Camouflage Contest 2026 Finalists" />
  <meta name="twitter:description" content="View the finalists and vote for your favorite camouflage designs." />
  <meta name="twitter:image" content="https://aeson000.github.io/camo-contest/Finalists/embed.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 id="pageTitle"></h1>
    <div class="topbar-actions">
      <label class="language-control">
        <span id="languageLabel"></span>
        <select id="languageSelect" aria-label="Language"></select>
      </label>
      <a id="discordButton" class="discord-button" href="#" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </header>

  <main>
    <section id="tileGrid" class="tile-grid" aria-live="polite"></section>
  </main>

  <section id="selectionBar" class="selection-bar" aria-live="polite">
    <div class="selection-content">
      <span id="selectionLabel"></span>
      <code id="selectionOutput"></code>
    </div>
    <button id="copyButton" type="button"></button>
  </section>

  <div id="renderModal" class="modal" hidden>
    <button id="modalBackdrop" class="modal-backdrop" type="button" aria-label="Close"></button>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <button id="closeModalButton" class="icon-button" type="button" aria-label="Close">×</button>
      </div>

      <div class="render-stage">
        <img id="renderImage" alt="" />
      </div>

      <div class="render-controls">
        <button id="previousRenderButton" type="button"></button>
        <span id="renderCounter"></span>
        <button id="nextRenderButton" type="button"></button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
